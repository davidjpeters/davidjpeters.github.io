<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade Tracker</title>
  <meta name="description" content="Track assignments, grades and GPA. Data stays in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="#/classes">Grade Tracker</a>
      <label class="semester-picker">
        <span class="visually-hidden">Semester</span>
        <select id="semester-select"></select>
      </label>
      <a id="backup-nag" class="backup-nag" href="#/settings" hidden>Back up your data</a>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#/classes" data-route="classes">My classes</a>
      <a href="#/assignments" data-route="assignments">Assignments</a>
      <a href="#/calendar" data-route="calendar">Calendar</a>
      <a href="#/grades" data-route="grades">Grades</a>
      <a href="#/semester" data-route="semester">Semester</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Plain scripts (not modules) so the page also works when opened from disk. Order matters. -->
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/classes.js"></script>
  <script src="js/views/assignments.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/grades.js"></script>
  <script src="js/views/semester.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
